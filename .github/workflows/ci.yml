name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lunaris
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lunaris_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lunaris -d lunaris_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lunaris:ci-only-password@localhost:5432/lunaris_unused
      TEST_DATABASE_URL: postgresql://lunaris:ci-only-password@localhost:5432/lunaris_test
      BETTER_AUTH_SECRET: ci-only-test-secret-not-for-deployment-123456789
      BETTER_AUTH_URL: http://localhost:4000
      FRONTEND_ORIGIN: http://localhost:3000
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --prod
      - run: pnpm build
